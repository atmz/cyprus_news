version: '3.8'

services:
  cyprus_news:
    build: .
    container_name: cyprus_news
    volumes:
      # No src/ or config/ bind mounts: code ships in the image (Dockerfile
      # COPY), so deploying = Portainer "pull and redeploy" with rebuild.
      # Mounting them broke prod twice — relative ./src failed under
      # Portainer (/data/compose/<id> has no checkout, 2026-09-29), and a
      # mounted NAS checkout silently overrode the fresh image with stale code.
      - /volume1/dockerdata/cyprus_news/data:/app/data
      - /volume1/dockerdata/cyprus_news/summaries:/app/summaries
      - /volume1/dockerdata/secrets/cyprus_news:/app/secrets
    environment:
      PUBLICATION_URL: https://cyprusnews.substack.com
      EMAIL: alex.toumazis@gmail.com
    working_dir: /app
    restart: unless-stopped
    entrypoint: ["cron", "-f"]
    shm_size: '1gb'